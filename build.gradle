plugins {
    id 'com.gtnewhorizons.retrolambda' version '1.8.1' apply false
    id 'net.minecraftforge.gradle' version '6.0.25' apply false
}

// Переключаемся на современный ForgeGradle 6 / Architectury, 
// который работает на актуальных серверах:
buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.architectury.dev/' }
    }
    dependencies {
        classpath 'com.github.GTNewHorizons:ForgeGradle:2.3-1.0.10-GTNH'
    }
}