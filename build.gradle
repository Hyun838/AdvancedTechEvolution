buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "cleanroom"
            url = "https://maven.cleanroommc.com"
        }
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
    }
    dependencies {
        classpath "com.cleanroommc:buildscript:1.0.0"
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.0.0"
group = "com.advancedtech"
archivesBaseName = "AdvancedTechEvolution"

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    version = "1.12.2-14.23.5.2860"
    runDir = "run"
    mappings = "stable_39"
}

repositories {
    mavenCentral()
    maven {
        name = "cleanroom"
        url = "https://maven.cleanroommc.com"
    }
    maven {
        name = "forge"
        url = "https://maven.minecraftforge.net"
    }
}

dependencies {
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version