buildscript {
    repositories {
        mavenCentral()
        maven { name = "forge"; url = "https://maven.minecraftforge.net" }
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = "0.1.0"
group = "com.advancedtech"
archivesBaseName = "AdvancedTechEvolution"
sourceCompatibility = targetCompatibility = '1.8'
compileJava { sourceCompatibility = targetCompatibility = '1.8' }

minecraft {
    version = "1.12.2-14.23.5.2860"
    runDir = "run"
    mappings = "stable_39"
}
repositories {
    maven { url = "https://maven.blamejared.com" }   // CraftTweaker
}
dependencies {
    // deobfCompile "CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.+"
}
processResources {
    inputs.property "version", project.version
    from(sourceSets.main.resources.srcDirs) { include 'mcmod.info'; expand 'version': project.version }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}
